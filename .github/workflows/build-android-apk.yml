name: Build ARROW X Android APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-android-apk.yml'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'ANDROID_RELEASE.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-x-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install web dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Install Capacitor Android tooling
        run: npm install --legacy-peer-deps --no-save --no-audit --no-fund @capacitor/core@^8.6.0 @capacitor/cli@^8.6.0 @capacitor/android@^8.6.0

      - name: Configure Capacitor with Google AdMob
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.arrowx.game",
            "appName": "ARROW X",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "android": {
              "allowMixedContent": false,
              "webContentsDebuggingEnabled": false
            },
            "plugins": {
              "AdMob": {
                "appId": "ca-app-pub-3940256099942544~3347511713",
                "initializeForTesting": true
              }
            }
          }
          EOF

      - name: Build web application
        run: npm run build

      - name: Generate Android project
        run: |
          npx cap add android

      - name: Inject Google AdMob App ID into AndroidManifest.xml
        run: |
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            if ! grep -q "com.google.android.gms.ads.APPLICATION_ID" android/app/src/main/AndroidManifest.xml; then
              sed -i '/<\/application>/i \\        <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="ca-app-pub-3940256099942544~3347511713"/>' android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Sync web assets
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload ARROW X APK
        uses: actions/upload-artifact@v4
        with:
          name: ARROW-X-latest-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trigger a fresh build without changing game source or AdMob test configuration.
